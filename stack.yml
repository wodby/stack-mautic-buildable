name: mautic-buildable
icon: mautic
docs: https://wodby.com/docs/2.0/stacks/catalog/mautic-buildable/
title: Mautic (buildable)
# A variant of the Mautic stack: the catalog suggests them to each other.
variantOf: mautic
variant: Buildable
variantDescription: >-
  Choose this when you want your own plugins or themes: keep Mautic as a
  Composer project in a Git repository, and Wodby builds Mautic from it.

services:
- name: mautic
  title: Mautic
  service: mautic-buildable
  required: true
  derivatives:
  - name: cron
    service: mautic-buildable-cron
  - name: worker
    service: mautic-buildable-worker
  volumes:
  - name: files
    size: 20
  links:
  - name: db
    service: mariadb
  - name: files
    service: files-nfs
  - name: sendmail
    service: opensmtpd

- name: mariadb
  title: MariaDB
  service: mariadb
  # Mautic 7 needs MariaDB 10.11 or later.
  options:
  - version: '12.3'
  - version: '11.8'
    default: true
  - version: '11.4'
  volumes:
  - name: data
    size: 10

- name: files-nfs
  title: Files NFS storage
  service: nfs-provisioner
  volumes:
  - name: data
    size: 25

- name: opensmtpd
  required: false
  title: OpenSMTPD
  service: opensmtpd
